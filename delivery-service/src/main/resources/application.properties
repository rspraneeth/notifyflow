# Application
spring.application.name=delivery-service
server.port=8083

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=delivery-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer

# Kafka topics
kafka.topic.email-events=email-events
kafka.topic.sms-events=sms-events
kafka.topic.push-events=push-events

# Mail - points to Mailhog
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Email sender
mail.from=notifications@notifyflow.com

# Actuator
management.endpoints.web.exposure.include=health,info