spring.application.name=core-processor

server.port=8082

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=core-processor-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

kafka.topic.customer-events=customer-events
kafka.topic.email-events=email-events
kafka.topic.sms-events=sms-events
kafka.topic.push-events=push-events
kafka.topic.dead-letter=customer-events-dlq

spring.datasource.url=jdbc:postgresql://localhost:5432/notifyflow
spring.datasource.username=notifyflow_user
spring.datasource.password=notifyflow_pass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.data.redis.host=localhost
spring.data.redis.port=6379

management.endpoints.web.exposure.include=health,info

springdoc.swagger-ui.path=/swagger-ui.html

customer.service.url=http://localhost:8084