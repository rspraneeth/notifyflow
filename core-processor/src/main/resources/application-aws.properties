# Server
server.port=8082

# Kafka - Aiven
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=SCRAM-SHA-256
spring.kafka.properties.sasl.jaas.config=${KAFKA_JAAS_CONFIG}
spring.kafka.properties.ssl.truststore.type=JKS
spring.kafka.properties.ssl.truststore.location=/home/ec2-user/kafka-truststore.jks
spring.kafka.properties.ssl.truststore.password=changeit
spring.kafka.consumer.group-id=core-processor-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Kafka topics
kafka.topic.customer-events=customer-events
kafka.topic.email-events=email-events
kafka.topic.sms-events=sms-events
kafka.topic.push-events=push-events
kafka.topic.dead-letter=customer-events-dlq

# Kafka memory optimization
spring.kafka.consumer.fetch-max-wait=500
spring.kafka.consumer.max-partition-fetch-bytes=102400
spring.kafka.properties.max.partition.fetch.bytes=102400
spring.kafka.properties.fetch.max.bytes=1048576
spring.kafka.properties.receive.buffer.bytes=32768
spring.kafka.properties.send.buffer.bytes=32768

# PostgreSQL - AWS RDS
spring.datasource.url=jdbc:postgresql://${RDS_HOST}:5432/postgres
spring.datasource.username=${RDS_USERNAME}
spring.datasource.password=${RDS_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Redis Cloud
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=true

# Customer service
customer.service.url=http://localhost:8084

# Actuator
management.endpoints.web.exposure.include=health,info